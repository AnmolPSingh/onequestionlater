# Netlify: set the site's base directory to `site`. Node comes from .nvmrc.
# onequestionlater.com is the main address; becuriousenough.com redirects to it, all paths included.
[[redirects]]
  from = "https://becuriousenough.com/*"
  to = "https://onequestionlater.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.becuriousenough.com/*"
  to = "https://onequestionlater.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/score/*.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
