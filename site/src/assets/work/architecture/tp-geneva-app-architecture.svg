<svg viewBox="0 0 1000 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tp-geneva-app-architecture-title tp-geneva-app-architecture-desc" class="architecture" style="min-width:1000px"><title id="tp-geneva-app-architecture-title">Talking Philanthropy Geneva app: how it fits together</title><desc id="tp-geneva-app-architecture-desc">Guests, the team and volunteers, and speakers each sign in to their own portal of one web app. The app checks guests in through a service that matches them against the in-person list in Mailchimp, records the arrival and tags it; it books team time through a service that reads and writes Outlook calendars; and everything else lives in one database whose access rules follow each role, which also sends bell and lock-screen notifications.</desc><defs><marker id="tp-geneva-app-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9a49b"/></marker><marker id="tp-geneva-app-architecture-arrow-neon" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f4f8ff"/></marker><filter id="tp-geneva-app-architecture-neon-glow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f4f8ff" flood-opacity="0.45"/></filter></defs><path d="M 236.0,96.0 H 356.0 Q 364.0,96.0 364.0,104.0 V 176.0" fill="none" stroke="#a9a49b" stroke-width="1.2" marker-end="url(#tp-geneva-app-architecture-arrow)"/><path d="M 236.0,208.0 H 316.0" fill="none" stroke="#a9a49b" stroke-width="1.2" marker-end="url(#tp-geneva-app-architecture-arrow)"/><path d="M 236.0,320.0 H 356.0 Q 364.0,320.0 364.0,312.0 V 240.0" fill="none" stroke="#a9a49b" stroke-width="1.2" marker-end="url(#tp-geneva-app-architecture-arrow)"/><path d="M 412.0,176.0 V 104.0 Q 412.0,96.0 420.0,96.0 H 540.0" fill="none" stroke="#a9a49b" stroke-width="1.2" marker-end="url(#tp-geneva-app-architecture-arrow)"/><path d="M 460.0,208.0 H 